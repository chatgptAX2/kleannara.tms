spring:
  application:
    name: kleannara-tms

  # -------------------------------------------------------
  # 다중 DataSource — auto-configuration 비활성
  # TmsJpaConfig / WmsJpaConfig 에서 수동 설정
  # -------------------------------------------------------
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  security:
    filter:
      order: 10

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 18081
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DataSource — 최상위 키 (spring: 밖에 위치해야 prefix 일치)
#
# ■ 다중 DataSource 패턴: @ConfigurationProperties + DataSourceBuilder
#   HikariCP 는 jdbcUrl 프로퍼티만 존재 (url 없음)
#   → yml 에 반드시 jdbc-url 키 사용
#
# ■ prefix 매핑
#   TmsDataSourceConfig → @ConfigurationProperties(prefix = "datasource.tms")
#   WmsDataSourceConfig → @ConfigurationProperties(prefix = "datasource.wms")
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── TMS DB (Oracle 19C — 개발서버) ────────────────────────
# PS제약조건관리 / 운송경로비용(BZPTN_DETAIL, ROUTE_COST) / 서류관리(DOC_FOLDER, DOC_FILE)
datasource:
  tms:
    jdbc-url: jdbc:oracle:thin:@10.2.14.190:1522:KNMESWMS
    username: KNRATMS
    password: kleannara12#
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariPool-TMS
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 580000
      keepalive-time: 300000

  # ── WMS DB (Oracle 19C — 개발서버) ───────────────────────
  # PS배차, 출고예정, 공통코드, 물류센터, 차량, 납품처(BZPTN), 출고오더(SHPDH/SHPDI) 등
  wms:
    jdbc-url: jdbc:oracle:thin:@10.2.14.190:1522:KNMESWMS
    username: KNRATMS
    password: kleannara12#
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariPool-WMS
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 서류 업로드 기본 경로
doc:
  upload:
    base-path: /data/tms/uploads

# SAP JCo 직접 연결 설정
sap:
  jco:
    ashost: localhost
    sysnum: "00"
    sysid:  ""
    client: "100"
    userid: ""
    passwd: ""
    langky: KO
    pool-capacity: 3
    peak-limit: 10
    mock: true

logging:
  level:
    com.company: INFO
    org.hibernate.SQL: WARN
