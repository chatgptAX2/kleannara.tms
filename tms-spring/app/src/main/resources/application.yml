spring:
  application:
    name: kleannara-tms

  # -------------------------------------------------------
  # 활성 프로파일: 외부 설정파일(/data/tms/config/application.yml)에서 지정
  #   실행 시 --spring.config.location 옵션으로 외부 파일 로드
  #   이 파일(application.yml)은 공통 기본값만 보유
  # -------------------------------------------------------

  # DB 커넥션은 외부 설정파일(/data/tms/config/application.yml)에서 설정
  jpa:
    hibernate:
      ddl-auto: none        # 테이블은 SQL 스크립트로 직접 생성
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        format_sql: true
    show-sql: false

  security:
    filter:
      order: 10

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 18081
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1   # 파일 업로드 크기 제한 해제

# 서류 업로드 기본 경로 (외부 설정파일에서 오버라이드)
doc:
  upload:
    base-path: /data/tms/uploads

# SAP RFC/WMS 연동 URL (실제 운영 시 환경변수로 오버라이드)
sap:
  rfc:
    url: ${SAP_RFC_URL:http://localhost:8000/sap/rfc}
    # mock=true: SAP 연결 없이 더미 응답 반환 (개발/테스트 환경)
    # 운영 배포 시 반드시 false 로 설정하거나 환경변수 SAP_RFC_MOCK=false 로 오버라이드
    mock: ${SAP_RFC_MOCK:true}
    timeout-seconds: ${SAP_RFC_TIMEOUT:30}
  wms:
    url: ${SAP_WMS_URL:http://localhost:9000/wms/ifc}

logging:
  level:
    com.company: INFO
    org.hibernate.SQL: WARN
