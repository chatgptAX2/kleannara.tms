spring:
  application:
    name: kleannara-tms

  # -------------------------------------------------------
  # 활성 프로파일 기본값: dev
  #   실행 시 오버라이드 가능
  #   · java -jar app.jar --spring.profiles.active=prod
  #   · 환경변수: SPRING_PROFILES_ACTIVE=prod
  # -------------------------------------------------------
  profiles:
    active: dev

  # DB 커넥션은 각 프로파일(dev/prod)에서 설정
  jpa:
    hibernate:
      ddl-auto: none        # 테이블은 SQL 스크립트로 직접 생성
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        format_sql: true
    show-sql: false

  security:
    filter:
      order: 10

server:
  port: 8080
  servlet:
    context-path: /

# JWT 설정
jwt:
  secret: kleannara-tms-jwt-secret-key-256bit-long-change-in-production
  expiration-ms: 86400000    # 24시간 (ms)

logging:
  level:
    com.company: INFO
    org.hibernate.SQL: WARN
