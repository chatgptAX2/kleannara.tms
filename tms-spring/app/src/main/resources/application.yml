spring:
  application:
    name: kleannara-tms

  # -------------------------------------------------------
  # 다중 DataSource — auto-configuration 비활성
  # TmsJpaConfig / WmsJpaConfig 에서 수동 설정
  # -------------------------------------------------------
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  security:
    filter:
      order: 10

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 18081
  servlet:
    context-path: /
  tomcat:
    max-swallow-size: -1

# ── TMS DB (MariaDB — Primary) ───────────────────────────
# PS제약조건관리 / 운송경로비용(BZPTN_DETAIL, ROUTE_COST) / 서류관리(DOC_FOLDER, DOC_FILE)
datasource:
  tms:
    jdbc-url: jdbc:mariadb://localhost:3306/tms_dev?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false
    username: tmsuser
    password: tmspassword
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: HikariPool-TMS
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── WMS DB (Oracle) ──────────────────────────────────────
  # PS배차, 출고예정, 공통코드, 물류센터, 차량, 납품처(BZPTN), 출고오더(SHPDH/SHPDI) 등
  wms:
    jdbc-url: jdbc:oracle:thin:@10.2.14.190:1522:KNMESWMS
    username: KNRATMS
    password: kleannara12#
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariPool-WMS
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# 서류 업로드 기본 경로
doc:
  upload:
    base-path: /data/tms/uploads

# SAP JCo 직접 연결 설정
sap:
  jco:
    ashost: localhost
    sysnum: "00"
    sysid:  ""
    client: "100"
    userid: ""
    passwd: ""
    langky: KO
    pool-capacity: 3
    peak-limit: 10
    mock: true

logging:
  level:
    com.company: INFO
    org.hibernate.SQL: WARN
