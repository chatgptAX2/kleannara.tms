# ======================================================
# 개발(DEV) 환경 설정
#
# ■ 다중 DataSource 패턴: @ConfigurationProperties + DataSourceBuilder
#   HikariCP 는 jdbcUrl 프로퍼티만 존재 (url 없음)
#   → yml 에 반드시 jdbc-url 키 사용
#
# ■ 개발 환경에서는 TMS DB / WMS DB 모두 Oracle 19C 개발서버 사용
#   Host : 10.2.14.190
#   Port : 1522
#   SID  : KNMESWMS
#   계정  : KNRAWMS / kleannara12#
# ======================================================

# ── TMS DB (Oracle 19C — 개발서버) ──────────────────────
# prefix: datasource.tms  ← TmsDataSourceConfig @ConfigurationProperties
datasource:
  tms:
    jdbc-url: jdbc:oracle:thin:@10.2.14.190:1522:KNMESWMS
    username: KNRAWMS
    password: kleannara12#
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariPool-TMS-DEV
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ── WMS DB (Oracle 19C — 개발서버) ──────────────────────
  # prefix: datasource.wms  ← WmsDataSourceConfig @ConfigurationProperties
  wms:
    jdbc-url: jdbc:oracle:thin:@10.2.14.190:1522:KNMESWMS
    username: KNRAWMS
    password: kleannara12#
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariPool-WMS-DEV
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.company: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
