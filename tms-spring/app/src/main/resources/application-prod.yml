# ======================================================
# 운영(PROD) 환경 설정
# DB    : MariaDB 10.11+  (utf8mb4)
# Host  : localhost:3306
# Schema: tms
# ======================================================
spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/tms?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: tmsuser
    password: tmspassword          # 운영 서버에서 환경변수로 오버라이드: SPRING_DATASOURCE_PASSWORD
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: HikariPool-PROD
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000      # 30초
      idle-timeout: 600000           # 10분
      max-lifetime: 1800000          # 30분
      connection-test-query: SELECT 1

  jpa:
    show-sql: false                  # 운영환경에서 SQL 미출력
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    com.company: INFO
    org.hibernate.SQL: WARN
