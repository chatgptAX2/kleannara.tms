# ======================================================
# [참고용 문서] 운영(PROD) 환경 설정 예시
#
# !! 이 파일은 실제 운영에서 사용하지 않습니다 !!
# !! 실제 설정은 서버의 아래 경로에 위치합니다  !!
#
#   /data/tms/config/application.yml
#
# systemd ExecStart 에서 아래 옵션으로 외부 파일을 로드:
#   --spring.config.location=file:/data/tms/config/application.yml
#
# ★★★ 서버 파일 업데이트 방법 ★★★
#
#   아래 내용을 서버의 /data/tms/config/application.yml 에 덮어쓰세요.
#   (vi 또는 cp 명령어 사용)
#
#   cp 사용 시:
#     scp application-prod.yml knaraadm@10.2.14.190:/data/tms/config/application.yml
#
#   수동 확인:
#     grep "driver-class-name" /data/tms/config/application.yml
#     → oracle.jdbc.OracleDriver 가 나와야 정상
#
# ======================================================

# ■ 다중 DataSource 패턴: @ConfigurationProperties + DataSourceBuilder
#
#   HikariCP 는 url 프로퍼티가 없고 jdbcUrl 만 존재.
#   DataSourceBuilder 로 HikariDataSource 를 직접 생성할 때는
#   Spring Boot 의 DataSourceProperties(url→jdbcUrl 자동변환)를 거치지 않으므로
#   yml 에 반드시 jdbc-url 키를 사용해야 한다.
#
#   참고: Spring Boot 공식 문서
#     "Hikari has no url property. Instead, it has a jdbc-url property."
#     https://docs.spring.io/spring-boot/how-to/data-access.html
#
# ■ prefix 매핑
#   TmsDataSourceConfig → @ConfigurationProperties(prefix = "datasource.tms")
#   WmsDataSourceConfig → @ConfigurationProperties(prefix = "datasource.wms")
#
#   → datasource: 는 반드시 최상위(spring: 밖) 에 위치해야 prefix 가 일치함

spring:
  profiles:
    active: prod

  # ── 다중 DataSource — Spring Boot 자동설정 비활성 (필수) ─────────────
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 18081

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# DataSource — 최상위 키 (spring: 밖에 위치해야 prefix 일치)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
datasource:

  # ── TMS DB (Oracle 19C — 개발/운영 서버) ──────────────
  tms:
    jdbc-url: jdbc:oracle:thin:@10.2.14.190:1522:KNMESWMS
    username: KNRAWMS
    password: kleannara12#
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariPool-TMS
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 580000
      keepalive-time: 300000

  # ── WMS DB (Oracle 19C — KNMESWMS — KNRAWMS 계정) ─────
  wms:
    jdbc-url: jdbc:oracle:thin:@10.2.14.190:1522:KNMESWMS
    username: KNRAWMS
    password: kleannara12#
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariPool-WMS
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

