# ======================================================
# [참고용 문서] 운영(PROD) 환경 설정 예시
#
# !! 이 파일은 실제 운영에서 사용하지 않습니다 !!
# !! 실제 설정은 서버의 아래 경로에 위치합니다  !!
#
#   /data/tms/config/application.yml
#
# systemd ExecStart 에서 아래 옵션으로 외부 파일을 로드:
#   --spring.config.location=file:/data/tms/config/application.yml
#
# DB    : MariaDB  Host: 10.2.14.247:3306  Schema: intergration
# ======================================================
spring:
  datasource:
    url: jdbc:mariadb://10.2.14.247:3306/intergration?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:tmsuser}
    password: ${DB_PASSWORD:tmspassword}          # 운영 서버에서 환경변수로 오버라이드: DB_PASSWORD
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: HikariPool-PROD
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000      # 30초
      idle-timeout: 600000           # 10분
      max-lifetime: 1800000          # 30분
      connection-test-query: SELECT 1

  jpa:
    show-sql: false                  # 운영환경에서 SQL 미출력
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    com.company: INFO
    org.hibernate.SQL: WARN
