# ============================================================
# Kleannara TMS — Nginx 설정
# 아키텍처: 외부(80) → Nginx → Spring Boot(18081)
# Flask 완전 제거 후 단일 Spring Boot 구성
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # 파일 업로드 크기 제한
    client_max_body_size 500M;

    # ── Spring Boot 업스트림 ──────────────────────────────────────
    upstream springboot {
        server 127.0.0.1:18081;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # 보안 헤더
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options SAMEORIGIN;

        # ── 정적 파일 (index.html, static/*) ─────────────────────
        # Flask 시절 wms-viewer/static/ → 이제 Spring Boot가 제공
        location / {
            proxy_pass         http://springboot;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── API 요청 (모든 /api/*, /*-api/*) ────────────────────
        location ~ ^/(api|auth|dispatch-api|dispatch-config-api|vehicle-api|delivery-api|shipment-api)/ {
            proxy_pass         http://springboot;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── 파일 다운로드/업로드 (긴 타임아웃) ──────────────────
        location /api/doc/ {
            proxy_pass         http://springboot;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 500M;
        }

        # ── 헬스체크 ─────────────────────────────────────────────
        location /actuator/health {
            proxy_pass http://springboot;
            access_log off;
        }

        # ── 에러 페이지 ───────────────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
